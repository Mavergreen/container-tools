name: boot2docker

# Build boot2docker.iso from the pinned dragonflylee source -- the SAME cmake iso build the box runs
# locally -- on Linux/x86_64. The supply-chain gate is the digest-verified clone (clone_pinned.sh in
# the boot2docker DOWNLOAD_COMMAND: the source must be exactly the pinned commit or the build bails);
# there is no frozen fingerprint of the built iso and no manual boot "bless" (those blocked bumps
# without a shippability signal). A Renovate bump of REF+DIGEST flows through green. The release .pkg's
# iso is built by release.yml's build-iso job, so no tag build here.
on:
  pull_request:
    paths:
      - 'components/boot2docker/**'
      - 'cmake/build_boot2docker.sh'
      - '.github/workflows/boot2docker.yml'
  push:
    branches: [main]
    paths:
      - 'components/boot2docker/**'
      - 'cmake/build_boot2docker.sh'
      - '.github/workflows/boot2docker.yml'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest   # native x86_64 Docker; separate from the macos-26 Mac build
    steps:
      - uses: actions/checkout@v7
      # clone_pinned.sh (the digest-verified git fetch) lives in shipyard; the iso build resolves it
      # via find_package, so shipyard must be installed here too.
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      # platform: shipyard ships no Linux pkg (install@v1's own non-macOS branch), so
      #           /usr/local/mavergreen-shipyard, where CMakePresets.json's top-level "include" points,
      #           does not exist here -- and that "include" is resolved eagerly for the WHOLE preset
      #           file, so it broke `--preset iso` too even though iso inherits nothing from it
      #           (verified: this job's first attempt at --preset iso failed with exactly "File not
      #           found"). tests/boot2docker_ci_test.sh greps for the literal `cmake --preset iso`
      #           form, so the fix is to make that path resolve, not to stop using --preset: symlink
      #           the SAME file install@v1 already checked out for us (MavericksShipyard_DIR) into the
      #           path the include expects.
      - name: Reach shipyard's shared presets (no Linux pkg installs them)
        run: |
          sudo mkdir -p /usr/local/mavergreen-shipyard/share/cmake/MavericksShipyard
          sudo ln -sf "$MavericksShipyard_DIR/mavericks-presets.json" \
            /usr/local/mavergreen-shipyard/share/cmake/MavericksShipyard/mavericks-presets.json
      # platform: ubuntu-latest also leaves $TMPDIR unset, and the iso preset's own environment
      #           computes MAVERICKS_BUILD_ROOT from $penv{TMPDIR} the same way shipyard's hidden
      #           native/cross presets do -- so TMPDIR itself, not just MAVERICKS_BUILD_ROOT, has to
      #           be real before --preset iso runs, or its binaryDir resolves to /mm-build (root).
      - name: Build out of tree
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
      - name: Derive the iso build directory
        run: echo "ISO_BUILD_DIR=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-iso" >> "$GITHUB_ENV"
      - name: Build + gate (same cmake iso build the box runs)
        run: |
          cmake --preset iso
          cmake --build --preset iso
          ctest --preset iso --output-on-failure
          ls -l "$ISO_BUILD_DIR/boot2docker"
      - uses: actions/upload-artifact@v7
        with:
          name: boot2docker-iso
          path: ${{ env.ISO_BUILD_DIR }}/boot2docker/boot2docker.iso
