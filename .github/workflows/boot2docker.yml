name: boot2docker

# Build boot2docker.iso from the pinned dragonflylee source -- the SAME cmake iso build the box runs
# locally -- on Linux/x86_64. The supply-chain gate is the digest-verified clone (clone_pinned.sh in
# the boot2docker DOWNLOAD_COMMAND: the source must be exactly the pinned commit or the build bails);
# there is no frozen fingerprint of the built iso and no manual boot "bless" (those blocked bumps
# without a shippability signal). A Renovate bump of REF+DIGEST flows through green. The release .pkg's
# iso is built by release.yml's build-iso job, so no tag build here.
on:
  pull_request:
    paths:
      - 'components/boot2docker/**'
      - 'cmake/build_boot2docker.sh'
      - '.github/workflows/boot2docker.yml'
  push:
    branches: [main]
    paths:
      - 'components/boot2docker/**'
      - 'cmake/build_boot2docker.sh'
      - '.github/workflows/boot2docker.yml'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest   # native x86_64 Docker; separate from the macos-26 Mac build
    steps:
      - uses: actions/checkout@v7
      # clone_pinned.sh (the digest-verified git fetch) lives in shipyard; the iso build resolves it
      # via find_package, so shipyard must be installed here too.
      - name: Install mavericks-shipyard
        uses: ModernMavericks/shipyard/.github/actions/install@v1
      # platform: ubuntu-latest leaves $TMPDIR unset, and CMakePresets.json's top-level "include"
      #           names a path shipyard only installs on macOS -- a --preset here fails to parse the
      #           whole file, iso included (verified: this job's first attempt at --preset iso did
      #           exactly that). So this job configures iso mode directly with -D, never through
      #           --preset, and only has to agree with itself on MAVERICKS_BUILD_ROOT --
      #           $RUNNER_TEMP is what the brief recommends and is always set.
      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
      - name: Build + gate (same cmake iso build the box runs)
        run: |
          BINARY_DIR="$MAVERICKS_BUILD_ROOT/container-tools-iso"
          cmake -S . -B "$BINARY_DIR" -DMAVERICKS_DOCKER_EXPECTED_MODE=iso
          cmake --build "$BINARY_DIR"
          ctest --test-dir "$BINARY_DIR" --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: boot2docker-iso
          path: ${{ env.MAVERICKS_BUILD_ROOT }}/container-tools-iso/boot2docker/boot2docker.iso
