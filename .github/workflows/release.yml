name: release

# Build the 10.9-compatible docker toolchain (CLI + Compose + Machine + lazydocker), the
# boot2docker.iso, the apps and the .pkg, all on Linux, build the Sparkle updater, assemble + sign the product .pkg, and attach
# the .pkg + signed appcast to a GitHub Release when a workflow_dispatch asks for one.
#
# Container Tools is its own upstream, versioned YYYYMMDD.N (see the ver job). Every publish is a FULL
# release -- no manual prerelease/promotion dance. CI proves the build +
# gates pass; a modern runner can't boot-proof the iso, so the boot-proof auto-skips (ctest code 77)
# and Sparkle surfaces any real-10.9 breakage. boot2docker updates flow the normal Renovate way: the
# bump PR builds the iso from the pinned source and runs the CI-possible gates (see boot2docker.yml)
# and automerges if they pass. There is deliberately NO frozen fingerprint of the built iso and no
# manual boot "bless": both blocked bumps, and the commit DIGEST in components/boot2docker/version is
# the reproducibility pin (clone_pinned.sh bails if a tag moved).

on:
  push:
    branches: [main]        # signal: build+gate every main push (surfaces a bump that broke something)
  pull_request:
    branches: [main]          # PR build is the status check Renovate automerge waits on
  workflow_dispatch:
    inputs:
      # The name is what shipyard's repackage-on-ingredient-bump.yml dispatches (local_release=true).
      local_release:
        description: "Cut+publish <UPSTREAM_VERSION>.(N+1): .1 after a date bump, else a same-date repackage"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# This repo publishes only from a dispatch, but keeps the family's one shape: most of the
# family's product repos auto-cut on a push to main, and a rule that holds only in some of them is a
# rule nobody can apply from memory.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job decides the version and whether this run publishes; every other job reads its outputs.
  # build-go and build-iso once resolved the version separately and disagreed (.15 vs .14 in one
  # run), so there is exactly one place that computes it.
  #
  # Container Tools is its own upstream (INGREDIENTS.md): UPSTREAM_VERSION is the date this repo's own
  # code last changed, and a release is <date>.N. N = 1 + the highest <date>.* tag, so the first release
  # after a date bump is .1 and an ingredient-only repackage on the same date is .(N+1). Derived from
  # tags, never from a file: a dispatch-cut version is not committed back.
  ver:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
      package: ${{ steps.ver.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Version (YYYYMMDD.N) + publish decision
        id: ver
        env:
          LOCAL_RELEASE: ${{ github.event.inputs.local_release }}
        run: |
          set -eu
          base="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          case "$base" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) : ;;
            *) echo "::error::UPSTREAM_VERSION must be a bare YYYYMMDD date, not '$base'"; exit 1 ;;
          esac
          maxn=0
          for t in $(git tag --list "$base.*"); do
            n="${t##*.}"
            case "$n" in ''|*[!0-9]*) : ;; *) [ "$n" -gt "$maxn" ] && maxn="$n" ;; esac
          done
          ver="$base.$((maxn + 1))"
          publish=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$LOCAL_RELEASE" = true ]; then
            publish=true
          fi
          # A pull request packages too, unsigned, so on-mavericks proves a Renovate bump on 10.9
          # before it merges, not only at release time.
          package=$publish
          [ "$GITHUB_EVENT_NAME" = pull_request ] && package=true
          { echo "version=$ver"; echo "publish=$publish"; echo "package=$package"; } >> "$GITHUB_OUTPUT"
          echo "version=$ver publish=$publish package=$package"

  # The Go components (docker, compose, machine, lazydocker), cross-built for 10.9 on Linux with
  # golang-port's Linux-hosted go126-cross (2026-11-24; until then this job ran on macos-26).
  # platform: build-go is main's required check, and GitHub counts a SKIPPED required check as
  #           passing, so build-go runs even when ver fails, and then fails first.
  build-go:
    needs: ver
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      # The compat guard and sdk_coverage read Mach-O with clang22's readers off macOS; clang22
      # comes with go126-cross (it requires it) at its Mac prefix.
      LIPO: /usr/local/mavergreen/clang22/bin/llvm-lipo
      OTOOL: /usr/local/mavergreen/clang22/bin/llvm-otool
      NM: /usr/local/mavergreen/clang22/bin/llvm-nm
      STRINGS: /usr/local/mavergreen/clang22/bin/llvm-strings
    steps:
      - name: The ver job succeeded
        env:
          VER_RESULT: ${{ needs.ver.result }}
        run: '[ "$VER_RESULT" = success ] || { echo "::error::ver ended $VER_RESULT, so this build has no version to build"; exit 1; }'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # generated notes and the shipyard install expect full history

      - name: Read the Go toolchain pin
        id: pins
        run: echo "golang=$(tr -d '[:space:]' < components/golang/version)" >> "$GITHUB_OUTPUT"

      # spec: shipyard .github/actions/install/action.yml `products` -- installs go126-cross at the pin
      #       and, first, what it requires (clang22, recaulk and sdk109, the 10.9 SDK its cgo wrapper
      #       compiles against), at /usr/local/mavergreen on Linux as on a Mac. Renovate bumps the pin
      #       (components/golang/version, github-releases on Mavergreen/golang-126).
      - name: Install mavericks-shipyard and the go126 cross toolchain
        uses: Mavergreen/shipyard/.github/actions/install@v1
        with:
          products: go126-cross@${{ steps.pins.outputs.golang }}

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      # spec: mavericks-presets.json's mavericks-native/-cross environment sets MAVERICKS_BUILD_ROOT
      #       from $penv{TMPDIR}/mm-build, and a preset's own environment overrides the real one -- so
      #       this must derive from the SAME $TMPDIR the presets read, not from $RUNNER_TEMP, or every
      #       reference below would point somewhere the configure step never wrote.
      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$TMPDIR/mm-build" >> "$GITHUB_ENV"

      - name: Derive the cross build directory
        run: echo "CROSS_BUILD_DIR=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross" >> "$GITHUB_ENV"

      # The ingredient pin list is derived from repackage-on-ingredient-bump.yml's own paths, so the
      # repackage trigger and the release notes can't drift -- but a glob that matches nothing would
      # silently mean no repackage and thinner notes. Fail here instead.
      - name: Guard the ingredient pin declaration
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      # VERSION is a gitignored build product: cmake (cmake/ContainerToolsVersion.cmake) reads it, so
      # the configure below and the updater bundle embed the version the ver job decided.
      - name: Write the version this run builds
        env:
          VER: ${{ needs.ver.outputs.version }}
        run: printf '%s\n' "$VER" > VERSION

      - name: Put go126-cross on PATH
        run: echo /usr/local/mavergreen/go126-cross/bin >> "$GITHUB_PATH"

      - name: Confirm the patched cross toolchain is on PATH
        run: |
          test "$(command -v go)" = /usr/local/mavergreen/go126-cross/bin/go
          go version

      - name: Cache the MacOSX10.9 SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.MAVERICKS_BUILD_ROOT }}/.sdk-cache
          key: macosx10.9-sdk-v1   # the SDK is pinned inside fetch_sdk.sh; key is stable across shipyard bumps

      - name: Build + gate (the SAME cmake build the Tahoe dry run runs)
        env:
          MAVERICKS_SDK_CACHE: ${{ env.MAVERICKS_BUILD_ROOT }}/.sdk-cache
        run: |
          shipyard-cmake --preset cross
          shipyard-cmake --build --preset cross
          shipyard-ctest --preset cross
          ls -l "$CROSS_BUILD_DIR/docker-cli/docker" "$CROSS_BUILD_DIR/docker-compose/docker-compose" \
            "$CROSS_BUILD_DIR/docker-machine/docker-machine" "$CROSS_BUILD_DIR/lazydocker/lazydocker"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      # When packaging: bundle the packaging inputs into ONE tarball so executable bits (binaries, the .app's
      # Mach-Os, the signer) survive the artifact round-trip -- artifacts otherwise drop file modes.
      - name: Stage + upload packaging inputs
        if: needs.ver.outputs.package == 'true'
        run: |
          CROSS="$CROSS_BUILD_DIR"
          mkdir -p stage
          cp "$CROSS/docker-cli/docker"            stage/docker
          cp "$CROSS/docker-compose/docker-compose" stage/docker-compose
          cp "$CROSS/docker-machine/docker-machine" stage/docker-machine
          cp "$CROSS/lazydocker/lazydocker"        stage/lazydocker
          tar -C stage -czf packaging-inputs.tgz .
          # Record what THIS job built from. The .pkg is assembled from two independent jobs -- these
          # binaries and an iso built on Linux -- so the risk worth catching is them coming from
          # different commits (a re-run, a stale artifact). Conformance compares the records.
          # build-info-macos.txt names the darwin binaries it records, not the host that built them.
          sh "$SHIPYARD_SCRIPTS/build-info.sh" build-info-macos.txt \
            variant=macos commit="$GITHUB_SHA" version="${{ needs.ver.outputs.version }}" \
            docker_cli="$(sed -n 's/^REF=//p' components/docker-cli/version)" \
            docker_compose="$(sed -n 's/^REF=//p' components/docker-compose/version)" \
            docker_machine="$(sed -n 's/^REF=//p' components/docker-machine/version)" \
            lazydocker="$(sed -n 's/^REF=//p' components/lazydocker/version)" \
            lazydocker_digest="$(sed -n 's/^DIGEST=//p' components/lazydocker/version)" \
            golang_toolchain="$(cat components/golang/version)"
      - name: Upload packaging inputs (packaging runs only)
        if: needs.ver.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packaging-inputs
          path: |
            packaging-inputs.tgz
            build-info-macos.txt

  # The Sparkle updater and the menu-bar app, x86_64 for 10.9, with clang22 and the pinned 10.9 SDK
  # on Linux (cmake/build_apps.sh, which also runs on a Mac and on 10.9). On every run, so a PR that
  # breaks either app fails here; the apps travel to package only when packaging.
  build-apps:
    needs: ver
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: The ver job succeeded
        env:
          VER_RESULT: ${{ needs.ver.result }}
        run: '[ "$VER_RESULT" = success ] || { echo "::error::ver ended $VER_RESULT, so this build has no version to build"; exit 1; }'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the apps' version derives from UPSTREAM_VERSION and the shipped tags
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record
      - name: Write the version this run builds
        env:
          VER: ${{ needs.ver.outputs.version }}
        run: printf '%s\n' "$VER" > VERSION
      - name: Build the updater (must not link docker) and the menu-bar app with clang22
        run: sh cmake/build_apps.sh "$RUNNER_TEMP/apps"
      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"
      - name: Stage the apps (packaging runs only)
        if: needs.ver.outputs.package == 'true'
        run: |
          mkdir -p apps
          cp -R "$RUNNER_TEMP/apps/container-tools-updater/container-tools-updater.app" apps/
          cp -R "$RUNNER_TEMP/apps/container-tools-menubar/DockerMenu.app" apps/
          tar -C apps -czf apps.tgz .   # one tarball, so the Mach-Os keep their executable bits
      - name: Upload the apps (packaging runs only)
        if: needs.ver.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apps
          path: apps.tgz

  # boot2docker.iso on native Linux/Docker. We only BUILD the iso here for the
  # .pkg; the source is digest-verified at clone time (clone_pinned.sh in the boot2docker DOWNLOAD_COMMAND
  # bails unless the checkout is the pinned commit). boot2docker.yml is the CI gate on bump PRs; runtime
  # issues in a shipped iso are fixed in a same-date .(N+1) repackage. Runs only when this run
  # publishes, and needs only ver (not build-go), so it keeps running in parallel with build-go.
  build-iso:
    needs: ver
    if: needs.ver.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # clone_pinned.sh lives in shipyard; the iso build resolves it via find_package.
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      # platform: shipyard ships no Linux pkg, so /usr/local/mavergreen/shipyard, where
      #           CMakePresets.json's top-level "include" points, does not exist here -- and that
      #           "include" is resolved eagerly for the whole preset file, so it breaks `--preset iso`
      #           too even though iso inherits nothing from it (verified against this repo's
      #           boot2docker.yml, the same job shape on the same runner OS). Symlink the SAME file
      #           install@v1 already checked out for us (MavericksShipyard_DIR) into the path the
      #           include expects, so this job can keep using --preset like build-go does.
      - name: Reach shipyard's shared presets (no Linux pkg installs them)
        run: |
          sudo mkdir -p /usr/local/mavergreen/shipyard/share/cmake/MavericksShipyard
          sudo ln -sf "$MavericksShipyard_DIR/mavericks-presets.json" \
            /usr/local/mavergreen/shipyard/share/cmake/MavericksShipyard/mavericks-presets.json

      # platform: ubuntu-latest also leaves $TMPDIR unset, and the iso preset's own environment
      #           computes MAVERICKS_BUILD_ROOT from $penv{TMPDIR} the same way shipyard's hidden
      #           native/cross presets do -- so TMPDIR itself has to be real before --preset iso runs.
      - name: Build out of tree
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
      - name: Derive the iso build directory
        run: echo "ISO_BUILD_DIR=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-iso" >> "$GITHUB_ENV"

      # The same version build-go writes, from the same ver job, BEFORE configuring -- so one .pkg
      # is never built from two versions.
      - name: Write the version this run builds
        env:
          VER: ${{ needs.ver.outputs.version }}
        run: printf '%s\n' "$VER" > VERSION

      - name: Build the boot2docker iso (same cmake iso build the box runs)
        run: |
          cmake --preset iso
          cmake --build --preset iso
          ISO_DIR="$ISO_BUILD_DIR/boot2docker"
          # The other half of the record (see build-go): same commit, plus the iso's own pins.
          sh "$SHIPYARD_SCRIPTS/build-info.sh" build-info-iso.txt \
            variant=iso commit="$GITHUB_SHA" version="$(cat VERSION)" \
            boot2docker="$(sed -n 's/^REF=//p' components/boot2docker/version)" \
            boot2docker_digest="$(sed -n 's/^DIGEST=//p' components/boot2docker/version)" \
            boot2docker_base="$(sed -n 's/^BASE=//p' components/boot2docker/version)" \
            iso_sha256="$(shasum -a 256 "$ISO_DIR/boot2docker.iso" | cut -d' ' -f1)"
          # Put the record BESIDE the iso and upload that one directory. Listing two paths with
          # different roots makes upload-artifact root the archive at their least common ancestor, so
          # the iso would arrive at iso/build-iso/boot2docker/boot2docker.iso and package_pkg would
          # not find it -- which is exactly what happened.
          mv build-info-iso.txt "$ISO_DIR/"
      - uses: actions/upload-artifact@v7
        with:
          name: boot2docker-iso
          path: ${{ env.ISO_BUILD_DIR }}/boot2docker/*

  # Assemble the product .pkg (signed, with its appcast, when publishing; unsigned on a pull request).
  # Needs the darwin binaries, the apps and the iso; stevedore builds the .pkg on Linux.
  package:
    if: needs.ver.outputs.package == 'true'
    needs: [ver, build-go, build-apps, build-iso]
    # Linux: shipyard's packaging, signing and conformance seams are host-agnostic (stevedore), and
    # clang22's llvm tools read the Mach-Os.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # generated notes diff ingredient pins against the previous release tag
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      - uses: actions/download-artifact@v8
        with: { name: packaging-inputs, path: dl }
      - uses: actions/download-artifact@v8
        with: { name: boot2docker-iso, path: iso }
      - uses: actions/download-artifact@v8
        with: { name: apps, path: dlapps }
      - name: clang22's Mach-O readers, for the steps that read the pkg
        run: |
          set -eu
          CL="$(sh cmake/fetch-clang22.sh)"
          { echo "LIPO=$CL/bin/llvm-lipo"; echo "OTOOL=$CL/bin/llvm-otool"; echo "NM=$CL/bin/llvm-nm"; echo "STRINGS=$CL/bin/llvm-strings"; } >> "$GITHUB_ENV"

      # This job's checkout is fresh (a separate runner from build-go), so it has no VERSION file.
      # Use the authoritative version the ver job decided (needs.ver.outputs.version), not
      # `cat VERSION`. This repo is its own upstream, so its version string doubles as the release tag.
      #
      # release-notes.sh derives the ingredient section itself, from the pins
      # repackage-on-ingredient-bump.yml watches -- no separate ingredient-pins.sh/ingredient-notes.sh
      # calls here, and no stubbed prose: a repackage that cannot say what moved must not ship.
      #
      # --product is the full prose name "Container Tools for Mavericks": a YYYYMMDD.N version is the
      # generator's self-upstream shape, whose title is "## <product> <version>" with nothing appended
      # (the -mavericks.N port shape appended " for Mavericks" itself, which is why this once passed
      # the bare noun).
      - name: Copy build-info records into dist
        run: |
          set -eu
          mkdir -p dist
          # Both halves' build records travel with the release: conformance compares them, and anyone
          # can see which commit each half came from.
          # Unconditional: both jobs always write one, so a missing record means a half did not run
          # the way we think it did. Tolerating that silently is how conformance ends up reporting
          # "ok" for a comparison it never made.
          cp dl/build-info-macos.txt iso/build-info-iso.txt dist/

      - name: Generate release notes
        env:
          VER: ${{ needs.ver.outputs.version }}
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "$VER" --version "$VER" \
            --product "Container Tools for Mavericks" --min-os 10.9.5 \
            --out dist/RELEASE_NOTES.md   # becomes the Release body; not attached as an asset
          echo "=== dist/RELEASE_NOTES.md ==="; cat dist/RELEASE_NOTES.md

      - name: Assemble the .pkg
        env:
          VER: ${{ needs.ver.outputs.version }}
        run: |
          [ -d "$SHIPYARD_SCRIPTS" ] || { echo "::error::SHIPYARD_SCRIPTS not set by install@v1"; exit 1; }
          mkdir -p in dist
          tar -C in -xzf dl/packaging-inputs.tgz      # restores executable bits
          tar -C in -xzf dlapps/apps.tgz
          PKG="dist/container-tools-$VER.pkg"

          sh cmake/package_pkg.sh --out "$PKG" --version "$VER" \
            --docker in/docker --compose in/docker-compose --machine in/docker-machine \
            --lazydocker in/lazydocker --iso iso/boot2docker.iso \
            --updater-app in/container-tools-updater.app \
            --docked payload/docked --sync-helper payload/container-tools-sync-image \
            --bootstrap payload/docker-machine-bootstrap \
            --common payload/docker-machine-common.sh \
            --ctl payload/docker-machine-ctl \
            --migrate payload/docker-machine-migrate \
            --get-fusion payload/container-tools-get-fusion \
            --menubar-app in/DockerMenu.app \
            --launch-agent payload/dev.mavergreen.container-tools-machine.plist \
            --resources cmake/resources --welcome Welcome.html

      # Sign the .pkg + render the signed appcast, only when publishing; sign_and_appcast.sh auto-fetches
      # the prebuilt ed25519-sign. The enclosure points at the versioned release asset; the client feed
      # is /latest/ resolves to this full release immediately, so Sparkle clients pick it up right away.
      - name: Sign the .pkg, render the appcast (publishing runs only)
        if: needs.ver.outputs.publish == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh` -> needs auth (else 403 rate-limit)
          VER: ${{ needs.ver.outputs.version }}
        run: |
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          PKG="dist/container-tools-$VER.pkg"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product container-tools --feed-dir dist \
            --channel-title "Container Tools for Mavericks" \
            --version "$VER" --pkg-url "$URL" --min-os 10.9.5 \
            --notes-file dist/RELEASE_NOTES.md --pkg "$PKG"
          echo "=== container-tools.xml ==="; cat dist/container-tools.xml
      # A pull request signs nothing (no key, and nothing it builds is published): an unsigned stand-in
      # feed lets conformance check the same dist shape a release has.
      - name: Stand-in appcast (unsigned; pull requests only)
        if: needs.ver.outputs.publish != 'true'
        env:
          VER: ${{ needs.ver.outputs.version }}
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" dist "$VER"
      # No SHA256SUMS here: publish-release.yml regenerates it over everything it attaches, so the
      # checksums cover the appcast too and no repo hand-rolls that step.
      # Conformance: the .pkg, the appcast and the version we are about to publish must agree with each
      # other and with the family's schemes, on a pull request's unsigned dist as on a release's.
      - name: Artifact conformance
        env:
          VER: ${{ needs.ver.outputs.version }}
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "$VER" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"
          # Behavior gate: a client on the previous release must actually SEE this as an upgrade -- a
          # numeric sparkle:version that orders strictly after the last published one. The conformance
          # check above verifies artifacts AGREE; it never exercised update ordering, which is the gap
          # the "-mavericks.N compares EQUAL -> you're up to date" bug shipped straight through.
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast dist/container-tools.xml --version "$VER"

      - uses: actions/upload-artifact@v7
        with:
          name: docker-pkg
          path: |
            dist/*.pkg
            dist/container-tools.xml
            dist/RELEASE_NOTES.md
            dist/build-info-*.txt

  # spec: tests/smoke-mavericks.sh -- acceptance on real 10.9: the pkg this run built, installed the way
  #       a user installs it, on a real 10.9.5 guest (Mavergreen/mavericks-vm); every shipped executable
  #       run there, and the repo's own tests run under 10.9's /bin/sh and tools. A skip (77) of the
  #       smoke fails here: this job exists so that it runs. publish waits for it. It runs on every
  #       run that packages -- a release, and every pull request, so a Renovate bump is proven on 10.9
  #       before it merges. A fork's pull request has no MAVERICKS_VM_KEY, so cannot boot the guest:
  #       it skips this. INGREDIENTS.md's on-target deviations name what the guest cannot run.
  on-mavericks:
    needs: [ver, package]
    if: needs.ver.outputs.package == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docker-pkg
          path: dist
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      # The guest gets the workspace, not this runner's shipyard checkout: copy the scripts in, so
      # the repo's tests run there through the same shared runner as everywhere else.
      - name: Bring shipyard's scripts into the workspace
        run: cp -R "$SHIPYARD_SCRIPTS" .shipyard-scripts
      - uses: Mavergreen/mavericks-vm@v1
        env:
          CT_VERSION: ${{ needs.ver.outputs.version }}
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          envs: CT_VERSION
          copyback: false
          debug-on-error: true
          run: |
            sw_vers
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            sudo installer -pkg "dist/container-tools-$CT_VERSION.pkg" -target /
            status=0; sh tests/smoke-mavericks.sh || status=$?
            [ "$status" -eq 0 ] || { echo "smoke-mavericks.sh exited $status (77 is a skip, a failure here)"; exit 1; }
            SHIPYARD_SCRIPTS="$PWD/.shipyard-scripts" sh .shipyard-scripts/run-repo-tests.sh

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read).
  scan:
    needs: [ver, build-go, package]
    if: always() && (needs.ver.outputs.publish == 'true')   # a build that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: docker-pkg
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  # All-or-nothing publish: the ONLY writer to Releases, gated on package. The shared workflow owns
  # the mechanics -- it regenerates SHA256SUMS, uses RELEASE_NOTES.md from the artifact as the body
  # (failing if it is missing or empty), and mints the tag at this commit, which a dispatch-cut
  # repackage needs since a GITHUB_TOKEN-pushed tag triggers nothing.
  publish:
    if: needs.ver.outputs.publish == 'true'
    needs: [ver, build-go, build-apps, package, scan, on-mavericks]
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.ver.outputs.version }}
      artifact: docker-pkg
